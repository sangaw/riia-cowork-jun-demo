<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentOps Dashboard</title>
  <link rel="stylesheet" href="shared/agentops.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="ao-header">
    <div class="ao-header-inner">
      <span class="ao-logo">⚙ AgentOps</span>
      <span class="ao-subtitle">Multi-Agent Pipeline Monitor</span>
    </div>
  </header>

  <main class="ao-main">
    <section id="panel-runs" class="ao-panel">
      <h2>Pipeline Run History</h2>
      <div id="runs-table-container"><p class="ao-loading">Loading…</p></div>
    </section>

    <section id="panel-scorecards" class="ao-panel">
      <h2>Agent Scorecards</h2>
      <div id="scorecards-container" class="ao-scorecards-grid"><p class="ao-loading">Loading…</p></div>
    </section>

    <section id="panel-grounding" class="ao-panel">
      <h2>Grounding Score Trend</h2>
      <div class="ao-chart-wrap"><canvas id="chart-grounding"></canvas></div>
    </section>

    <section id="panel-failures" class="ao-panel">
      <h2>Failure Mode Heatmap</h2>
      <div id="failures-container"><p class="ao-loading">Loading…</p></div>
    </section>

    <section id="panel-tokens" class="ao-panel">
      <h2>Token Cost Trend</h2>
      <div class="ao-chart-wrap"><canvas id="chart-tokens"></canvas></div>
    </section>

    <section id="panel-skills" class="ao-panel">
      <h2>Skill File Version History</h2>
      <div id="skills-container"><p class="ao-loading">Loading…</p></div>
    </section>
  </main>

  <script src="shared/agentops.js"></script>
</body>
</html>
