name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff>=0.4"

      - name: Lint
        run: ruff check riia-jun-release/src/

  test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      RITA_ENV: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with dev deps
        run: pip install -e "riia-jun-release/[dev]"

      - name: Run database migrations
        working-directory: riia-jun-release
        run: alembic upgrade head

      - name: Run unit tests
        run: >
          pytest riia-jun-release/tests/unit/
          --junitxml=riia-jun-release/test-results/unit/latest.xml
          --tb=short -q
          --cov=rita
          --cov-report=term-missing
          --cov-fail-under=80

      - name: Run integration tests
        run: >
          pytest riia-jun-release/tests/integration/
          --junitxml=riia-jun-release/test-results/integration/latest.xml
          --tb=short -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  e2e:
    needs: test
    runs-on: ubuntu-latest
    env:
      RITA_ENV: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with dev deps
        run: pip install -e "riia-jun-release/[dev]"

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run database migrations
        working-directory: riia-jun-release
        run: alembic upgrade head

      - name: Run e2e smoke tests
        run: pytest riia-jun-release/tests/e2e/test_smoke.py --tb=short -q

      - name: Run e2e RITA scenarios
        run: >
          pytest riia-jun-release/tests/e2e/test_rita_scenarios.py
          --junitxml=riia-jun-release/test-results/e2e/rita/latest.xml
          --tb=short -q

      - name: Run e2e FnO scenarios
        run: >
          pytest riia-jun-release/tests/e2e/test_fno_scenarios.py
          --junitxml=riia-jun-release/test-results/e2e/fno/latest.xml
          --tb=short -q

      - name: Run e2e Ops scenarios
        run: >
          pytest riia-jun-release/tests/e2e/test_ops_scenarios.py
          --junitxml=riia-jun-release/test-results/e2e/ops/latest.xml
          --tb=short -q

